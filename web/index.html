<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tilt Avatars</title>
    <style>
      #scrolling-banner {
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
        box-sizing: border-box;
        background-color: blue; /* Background color for better visibility */
      }
      #scrolling-banner span {
        display: inline-block;
        padding-left: 100%;
        animation: scroll 10s linear infinite;
        color: yellow; /* Bright yellow text */
      }
      @keyframes scroll {
        0% {
          transform: translateX(0%);
        }
        100% {
          transform: translateX(-100%);
        }
      }
    </style>
  </head>
  <body>
    <h1>DOCKER COMPOSE WATCH DEMO</h1>
    <div id="root">
      <div id="scrolling-banner">
        <span>To add a watch stanza to your compose.yaml file for monitoring changes to the UI, you can use the sync action. This will ensure that any changes made to your local UI source files are automatically synchronized with the corresponding files in the container.</span>
      </div>  
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
